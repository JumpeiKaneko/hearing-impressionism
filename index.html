<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聴く絵画 - Hearing Impressionism</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cursor"></div>
    <div class="cursor-follower"></div>

    <div class="noise-overlay"></div>

    <main class="wrapper">
        <header class="header reveal-target">
            <p class="subtitle">Hearing Impressionism</p>
            <h1 class="title">聴く絵画</h1>
        </header>
        
        <section class="concept reveal-target">
            <p>「耳で視る」絵画のインターフェースを作るプロジェクト。</p>
            <p>視覚や言葉による説明に頼らず、誰もが作品の空間に入り込み「実感」できる環境を構築する。</p>
            <p>鑑賞者が音の世界に触れることで、絵画の「つづき」の物語が生まれる新たな鑑賞体験を提案する。</p>
        </section>

        <nav aria-label="展示作品一覧" class="exhibition-nav reveal-target">
            <ul class="works">
                <li class="work-item">
                    <a href="./WebGL_Build/index.html" class="work-link hover-target">
                        <span class="work-title">ジベルニーの庭</span>
                        <div class="work-action">
                            <span class="action-text">Enter the space</span>
                            <span class="action-line"></span>
                        </div>
                    </a>
                </li>
            </ul>
        </nav>
    </main>

    <script>
        const cursor = document.querySelector('.cursor');
        const follower = document.querySelector('.cursor-follower');
        const hoverTargets = document.querySelectorAll('.hover-target');

        // スマホなどのタッチデバイスでは動かさない
        if (window.matchMedia("(pointer: fine)").matches) {
            document.addEventListener('mousemove', (e) => {
                cursor.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`;
                // フォロワーは少し遅れてついてくる（ヌルッとした動き）
                setTimeout(() => {
                    follower.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`;
                }, 80);
            });

            // リンクにマウスが乗ったときの「おお！」となる反転エフェクト
            hoverTargets.forEach(target => {
                target.addEventListener('mouseenter', () => {
                    cursor.classList.add('is-active');
                    follower.classList.add('is-active');
                });
                target.addEventListener('mouseleave', () => {
                    cursor.classList.remove('is-active');
                    follower.classList.remove('is-active');
                });
            });
        }
    </script>
</body>
</html>
