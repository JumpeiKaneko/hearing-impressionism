<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>追憶 - 音間 OTOMA</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body style="align-items: flex-start; padding-top: 5rem;">
    <div class="cursor"></div>
    <div class="cursor-follower"></div>
    <div class="noise-overlay"></div>

    <main class="wrapper">
        <a href="index.html" class="back-link hover-target">← BACK TO HOME</a>

        <div class="reveal-target">
            <div class="album-cover-large" style="background-image: url('image/reminiscence.jpg');"></div>
            
            <div class="album-header">
                <h1 class="title">追憶</h1>
            </div>

            <ul class="track-list">
                <li class="track-item">
                    <div class="track-disabled">
                        <span class="track-number">01</span>
                        <span class="track-name">Coming Soon...</span>
                    </div>
                </li>
            </ul>
        </div>
    </main>

    <script>
        const cursor = document.querySelector('.cursor');
        const follower = document.querySelector('.cursor-follower');
        const hoverTargets = document.querySelectorAll('.hover-target');

        if (window.matchMedia("(pointer: fine)").matches) {
            document.addEventListener('mousemove', (e) => {
                cursor.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`;
                setTimeout(() => { follower.style.transform = `translate(${e.clientX}px, ${e.clientY}px)`; }, 80);
            });
            hoverTargets.forEach(target => {
                target.addEventListener('mouseenter', () => { cursor.classList.add('is-active'); follower.classList.add('is-active'); });
                target.addEventListener('mouseleave', () => { cursor.classList.remove('is-active'); follower.classList.remove('is-active'); });
            });
        }
    </script>
</body>
</html>
