<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ジベルニーの庭 - 聴く絵画</title>
    <style>
        /* 画面全体を真っ黒にし、スクロールや余白を消す */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: "Helvetica Neue", "Inter", "Hiragino Kaku Gothic ProN", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        #unity-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        #unity-canvas {
            width: 100%;
            height: 100%;
            background: #000;
            outline: none;
        }

        /* 読み込み中＆タップ待ちの真っ黒なカバー */
        #loading-cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            color: #eaeaea;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        #loading-text {
            font-size: 0.85rem;
            letter-spacing: 0.2em;
            color: #888;
        }

        /* 読み込み完了後に表示される入室ボタン */
        #tap-to-start {
            display: none; /* 最初は隠しておく */
            cursor: pointer;
            padding: 15px 30px;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 4px;
            letter-spacing: 0.1em;
            font-size: 0.95rem;
            font-weight: 300;
            transition: all 0.4s ease;
            background: transparent;
            color: #fff;
        }

        @media (hover: hover) {
            #tap-to-start:hover {
                background: #fff;
                color: #000;
            }
        }
    </style>
</head>
<body>
    <div id="unity-container">
        <canvas id="unity-canvas"></canvas>
    </div>

    <div id="loading-cover">
        <div id="loading-text">Loading Soundscape... <span id="progress">0%</span></div>
        <button id="tap-to-start">画面をタップして入る</button>
    </div>

    <script>
      // 圧縮なし（Disabled）で書き出したファイル群を読み込む設定
      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGL_Build.loader.js";
      var config = {
        dataUrl: buildUrl + "/WebGL_Build.data",
        frameworkUrl: buildUrl + "/WebGL_Build.framework.js",
        codeUrl: buildUrl + "/WebGL_Build.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "HearingImpressionism",
        productName: "Giverny",
        productVersion: "1.0",
      };

      var canvas = document.querySelector("#unity-canvas");
      var loadingCover = document.querySelector("#loading-cover");
      var loadingText = document.querySelector("#loading-text");
      var progressText = document.querySelector("#progress");
      var tapButton = document.querySelector("#tap-to-start");

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          // 読み込みのパーセンテージを更新
          progressText.innerText = Math.floor(progress * 100) + "%";
        }).then((unityInstance) => {
          // 読み込みが完了したら、Loadingの文字を消してボタンを出す
          loadingText.style.display = "none";
          tapButton.style.display = "block";

          // ボタンが押されたらカバーを消して音世界をスタート
          tapButton.onclick = () => {
            loadingCover.style.opacity = "0";
            setTimeout(() => { loadingCover.style.display = "none"; }, 500); // フワッと消える
          };
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
</body>
</html>
